<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="maincontainer">
    <div class="container1">

        <div class="container2">

            <h3>Your Result</h3>

            <div class="score">
                <span class="number">76</span>
                <span>of 100</span>
            </div>

            <h1>Great</h1>

            <p>
                You scored higher than 65% of<br>
                the people who have taken<br>
                these tests.
            </p>

        </div>

        <div class="container3">

            <h2>Summary</h2>

            <div class="item reaction">
                <img src="./assets/images/icon-reaction.svg">
                <span> Reaction</span>
                <strong>80 <small>/ 100</small></strong>
            </div>

            <div class="item memory">
                <img src="./assets/images/icon-memory.svg">
                <span> Memory</span>
                <strong>92 <small>/ 100</small></strong>
            </div>

            <div class="item verbal">
                <img src="./assets/images/icon-verbal.svg">
                <span> Verbal</span>
                <strong>61 <small>/ 100</small></strong>
            </div>

            <div class="item visual">
                <img src="./assets/images/icon-visual.svg">
                <span> Visual</span>
                <strong>73 <small>/ 100</small></strong>
            </div>

            <button>Continue</button>

        </div>

    </div>
</main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
